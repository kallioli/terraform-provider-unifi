kind: fix
body: '**Destroying an object that is already gone from the controller no longer fails.** `unifi_dns_record`, `unifi_firewall_zone`, `unifi_network`, `unifi_radius_user`, `unifi_site`, `unifi_vpn_client`, `unifi_vpn_server`, `unifi_wan`, `unifi_wireguard_peer` and `unifi_wlan` returned the controller''s error when the object had been removed out of band after the last refresh (or with `-refresh=false`), so the destroy or replacement stopped and needed a `terraform state rm`. A delete answered with HTTP 404 now counts as done, like the other resources already did. Any other delete error is checked by fetching the object again: the delete counts as done only if the controller confirms the object is gone, and the error is reported as before otherwise.'
time: 2026-11-26T22:10:00Z
