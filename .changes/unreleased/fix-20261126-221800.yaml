kind: fix
body: '**`unifi_network` `ipv6.setting_preference` and `unifi_wan` `setting_preference` no longer plan a stored null as a known value on update.** A network or WAN the provider has never written can be stored without these keys, so they read as null. When another attribute changed, the plan copied that null from state, and a controller that writes its own value when it saves the object would fail the apply with "inconsistent result after apply". A null prior value is now left `(known after apply)`, the same change #732 and #739 make for `unifi_network`''s `setting_preference` and `unifi_wan`''s `ipv6_setting_preference`. For `unifi_network` this applies when the `ipv6` block is configured; an omitted block still carries its prior value whole'
time: 2026-11-26T22:18:00Z
